<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Follow One Click</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a transit map. The top bar is a route line with eight stops; each page is one stop on the journey of a single click. */
:root{
  --bg:#EEF1F8; --surface:#FFFFFF; --surface-2:#E3E8F4; --ink:#0F1533; --muted:#4D5578; --line:#C9D0E4;
  --accent:#2747D8; --accent-ink:#FFFFFF;
  --good:#127A43; --good-bg:#DDF3E6; --bad:#B4232C; --bad-bg:#FBE1E2;
  --c-protocol:#C92A3A; --c-domain:#2747D8; --c-file:#3F7D0C; --c-cookie:#B5630A;
  --c-browser:#6B3FD4; --c-dns:#B8257F; --c-server:#0B7A75;
  --f-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",Verdana,system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:14px; --shadow:0 1px 0 rgba(15,21,51,.06),0 8px 24px -12px rgba(15,21,51,.25);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0B0F22; --surface:#151B38; --surface-2:#1F2750; --ink:#EEF1FF; --muted:#A9B2D6; --line:#313A66;
  --accent:#8FA4FF; --accent-ink:#0B0F22;
  --good:#6FD9A0; --good-bg:#123524; --bad:#FF9AA0; --bad-bg:#3D151A;
  --c-protocol:#FF8A94; --c-domain:#8FA4FF; --c-file:#A6DB6B; --c-cookie:#F2B25C;
  --c-browser:#B79CFF; --c-dns:#F58AC9; --c-server:#5FD3CC;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.8);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0B0F22; --surface:#151B38; --surface-2:#1F2750; --ink:#EEF1FF; --muted:#A9B2D6; --line:#313A66;
  --accent:#8FA4FF; --accent-ink:#0B0F22;
  --good:#6FD9A0; --good-bg:#123524; --bad:#FF9AA0; --bad-bg:#3D151A;
  --c-protocol:#FF8A94; --c-domain:#8FA4FF; --c-file:#A6DB6B; --c-cookie:#F2B25C;
  --c-browser:#B79CFF; --c-dns:#F58AC9; --c-server:#5FD3CC;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.55 var(--f-body);
  background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:22px 22px}
h1,h2,h3{font-family:var(--f-display);line-height:1.08;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(2.1rem,6vw,3.6rem);font-weight:800}
h2{font-size:clamp(1.35rem,3.4vw,1.8rem);font-weight:700}
h3{font-size:1.1rem;font-weight:700}
p{margin:0}
a{color:var(--accent)}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono);overflow-wrap:anywhere}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* route bar */
.bar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:2px solid var(--ink)}
.bar-in{max-width:1080px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.05rem;text-decoration:none;color:var(--ink);white-space:nowrap}
.brand b{background:var(--ink);color:var(--surface);padding:2px 7px;border-radius:6px;margin-right:6px;font-family:var(--f-mono);font-size:.85rem}
.route{flex:1;display:flex;gap:0;overflow-x:auto;scrollbar-width:none;padding:4px 2px}
.route::-webkit-scrollbar{display:none}
.route a{flex:1 0 auto;min-width:64px;min-height:44px;display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--muted);font-size:.72rem;font-weight:700;position:relative;padding:0 6px}
.route a::before{content:"";position:absolute;top:11px;left:0;right:0;height:4px;background:var(--line)}
.route a:first-child::before{left:50%}.route a:last-child::before{right:50%}
.route a i{position:relative;width:26px;height:26px;border-radius:50%;background:var(--surface);border:3px solid var(--line);display:grid;place-items:center;font:700 .72rem var(--f-mono);font-style:normal;color:var(--muted)}
.route a.done i{background:var(--good);border-color:var(--good);color:var(--surface)}
.route a.done::before{background:var(--good)}
.route a[aria-current="page"]{color:var(--ink)}
.route a[aria-current="page"] i{border-color:var(--ink);background:var(--ink);color:var(--surface);transform:scale(1.12)}
.icon-btn{min-width:44px;min-height:44px;border:2px solid var(--line);background:var(--surface);border-radius:10px;font-weight:700}
@media (max-width:640px){.brand span{display:none}}

main{max-width:1080px;margin:0 auto;padding:28px 16px 80px;display:flex;flex-direction:column;gap:28px}
.phead{display:flex;flex-direction:column;gap:12px;max-width:820px}
.stop{font:700 .8rem var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.big{font-size:clamp(1.1rem,2.6vw,1.35rem);max-width:60ch;border-left:6px solid var(--accent);padding-left:14px}
.card{background:var(--surface);border:2px solid var(--ink);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.card{min-width:0}.card>p,.card li{max-width:68ch;overflow-wrap:anywhere}
.hint{color:var(--muted);font-size:.95rem}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.btn{min-height:44px;padding:8px 16px;border-radius:999px;border:2px solid var(--ink);background:var(--surface);font-weight:700;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:8px;transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font:700 .78rem var(--f-mono);border:2px solid currentColor}
.t-protocol{color:var(--c-protocol)}.t-domain{color:var(--c-domain)}.t-file{color:var(--c-file)}.t-cookie{color:var(--c-cookie)}.t-browser{color:var(--c-browser)}.t-dns{color:var(--c-dns)}.t-server{color:var(--c-server)}
.exam{border-left:8px solid var(--good)}
.exam h3::before{content:"✓ ";color:var(--good)}
.mistake{border-left:8px solid var(--bad)}
.mistake h3::before{content:"✗ ";color:var(--bad)}
.exam ul,.card ul,.card ol{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.fb{min-height:1.5em;font-weight:700}
.fb.ok{color:var(--good)}.fb.no{color:var(--bad)}
.pn{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.shake{animation:shake .3s}
.pop{animation:pop .35s}

/* quick check */
.qc fieldset{border:0;padding:0;margin:0;min-width:0;overflow-wrap:anywhere;display:flex;flex-direction:column;gap:8px}
.qc legend{font-weight:700;padding:0;max-width:100%;margin-bottom:6px}
.opt{text-align:left;min-height:44px;padding:8px 14px;border-radius:10px;border:2px solid var(--line);background:var(--surface)}
.opt:hover{border-color:var(--ink)}
.opt.right{background:var(--good-bg);border-color:var(--good)}
.opt.right::after{content:"  ✓ correct";font-weight:700;color:var(--good)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.opt.wrong::after{content:"  ✗ try again";font-weight:700;color:var(--bad)}
.complete{background:var(--good-bg);color:var(--good);border:2px solid var(--good);border-radius:10px;padding:10px 14px;font-weight:700}

/* sorter + matcher */
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:44px}
.chip{min-height:44px;padding:8px 12px;border-radius:10px;border:2px solid var(--ink);background:var(--surface);text-align:left;font-size:.95rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px}
.bin{border:3px dashed var(--line);border-radius:var(--r);padding:12px;min-height:120px;background:var(--surface-2);display:flex;flex-direction:column;gap:8px;text-align:left;width:100%}
.bin.ready{border-color:var(--accent);border-style:solid}
.bin strong{font-family:var(--f-display);font-size:1.1rem}
.bin span.in{background:var(--surface);border-radius:8px;padding:6px 10px;font-size:.9rem;border-left:5px solid var(--good)}
.match{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:10px}
.match>div{display:flex;flex-direction:column;gap:8px}
.chip.locked{border-color:var(--good);background:var(--good-bg);cursor:default}
.chip .n{font:700 .8rem var(--f-mono);margin-right:6px}

/* scene */
.scene{position:relative;aspect-ratio:16/9;min-height:320px;background:var(--surface-2);border-radius:var(--r);border:2px solid var(--ink);overflow:hidden}
@media (max-width:640px){.scene{aspect-ratio:1/1.15}.node small{display:none}.node{padding:6px}}
.wires{position:absolute;inset:0;width:100%;height:100%}
.wires line{stroke:var(--line);stroke-width:5;vector-effect:non-scaling-stroke;stroke-linecap:round}
.wires line.on{stroke:var(--ink)}
.node{position:absolute;transform:translate(-50%,-50%);width:clamp(92px,17vw,150px);background:var(--surface);border:3px solid currentColor;border-radius:12px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;transition:box-shadow .2s,transform .2s}
.node b{font-family:var(--f-display);font-size:.9rem;color:var(--ink)}
.node small{font:500 .62rem var(--f-mono);color:var(--muted);overflow-wrap:anywhere;line-height:1.25}
.node.active{box-shadow:0 0 0 6px color-mix(in srgb,currentColor 25%,transparent);transform:translate(-50%,-50%) scale(1.05)}
.node svg{width:34px;height:34px}
.node .ab{width:100%;font:500 .58rem var(--f-mono);background:var(--surface-2);border-radius:5px;padding:2px 4px;color:var(--ink);min-height:1.5em;overflow:hidden;white-space:nowrap}
.node .scr{width:100%;height:30px;border-radius:5px;background:var(--surface-2);display:grid;place-items:center;font-size:.62rem;color:var(--muted)}
.node .scr.loaded{background:var(--good-bg);color:var(--good);font-weight:700}
.node[hidden]{display:none}
.packet{position:absolute;transform:translate(-50%,-50%);z-index:3;background:var(--ink);color:var(--surface);font:700 .68rem var(--f-mono);padding:5px 9px;border-radius:999px;white-space:nowrap;box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 40%,transparent)}
.packet[hidden]{display:none}
.steps{counter-reset:s;list-style:none;padding:0!important}
.steps li{counter-increment:s;padding:8px 10px 8px 44px;border-radius:10px;position:relative;border:2px solid transparent}
.steps li::before{content:counter(s);position:absolute;left:8px;top:8px;width:26px;height:26px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font:700 .8rem var(--f-mono)}
.steps li.cur{border-color:var(--ink);background:var(--surface-2)}
.steps li.cur::before{background:var(--ink);color:var(--surface)}
.steps li.past::before{background:var(--good);color:var(--surface);content:"✓"}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
.hero h1{font-size:clamp(2.8rem,10vw,6rem);line-height:.92}
.hero h1 em{font-style:normal;color:var(--accent);display:block}
.stops{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:14px}
.stopcard{text-decoration:none;color:var(--ink);background:var(--surface);border:2px solid var(--ink);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);transition:transform .15s;border-top:10px solid var(--k)}
.stopcard:hover{transform:translateY(-4px)}
.stopcard .num{font:700 .8rem var(--f-mono);color:var(--muted)}
.stopcard .st{font-weight:700;font-size:.85rem}
.stopcard.done .st{color:var(--good)}

/* internet layers */
.layers{display:flex;flex-direction:column;gap:10px}
.services{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px}
.svc{border:2px solid var(--ink);border-radius:12px;padding:12px;background:var(--surface);display:flex;flex-direction:column;gap:6px;min-height:120px;transition:opacity .3s,filter .3s}
.svc.off{opacity:.4;filter:grayscale(1)}
.svc.www{border-color:var(--c-domain);border-width:4px}
.svc .tag{font:700 .7rem var(--f-mono);color:var(--c-domain)}
.svc label{display:flex;gap:8px;align-items:center;min-height:44px;font-weight:700}
.svc input{width:22px;height:22px}
.infra{border:2px solid var(--ink);border-radius:12px;padding:14px;background:var(--ink);color:var(--surface);display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
.infra.off{background:var(--muted)}
.road{height:10px;border-radius:5px;background:repeating-linear-gradient(90deg,var(--surface) 0 14px,transparent 14px 28px);opacity:.55}
.infra:not(.off) .road{animation:road 1.2s linear infinite}
@keyframes road{to{background-position:28px 0}}
.infra label{display:flex;gap:10px;align-items:center;min-height:44px;font-weight:700}
.infra input{width:24px;height:24px}

/* url */
.urlbig{font:700 clamp(.95rem,3.3vw,1.7rem) var(--f-mono);display:flex;flex-wrap:wrap;row-gap:10px;align-items:flex-end;overflow-wrap:anywhere}
.seg{max-width:100%;word-break:break-all;text-align:left;background:none;border:0;border-bottom:6px solid currentColor;padding:8px 2px 4px;font:inherit;min-height:44px;transition:transform .2s,background .2s;border-radius:6px 6px 0 0}
.seg:hover,.seg[aria-pressed="true"]{transform:translateY(-6px);background:color-mix(in srgb,currentColor 14%,transparent)}
.seg.hit{background:var(--good-bg)}
.sep{color:var(--muted);padding-bottom:10px}
.info{border-radius:12px;padding:14px;background:var(--surface-2);border-left:8px solid currentColor;min-height:96px}
.info p{color:var(--ink)}

/* http lane */
.lane{position:relative;display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;align-items:start;padding:14px;background:var(--surface-2);border-radius:var(--r);border:2px solid var(--ink)}
.lane .box{background:var(--surface);border:3px solid currentColor;border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;min-height:150px;font-size:.85rem}
.lane .box b{font-family:var(--f-display);color:var(--ink)}
.lane .box .mono{font-size:.72rem;word-break:break-all;color:var(--ink);background:var(--surface-2);padding:6px;border-radius:6px;min-height:3.2em}
.spy{color:var(--bad)}
.wire{grid-column:1/-1;height:44px;position:relative;border-radius:999px;background:repeating-linear-gradient(90deg,var(--line) 0 10px,transparent 10px 20px)}
.wire .packet{top:50%;left:8%;max-width:70%;overflow:hidden;text-overflow:ellipsis}
.seg-toggle{display:inline-flex;border:2px solid var(--ink);border-radius:999px;overflow:hidden}
.seg-toggle button{min-height:44px;padding:6px 18px;border:0;background:var(--surface);font:700 1rem var(--f-mono)}
.seg-toggle button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.addr{display:flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:999px;padding:6px 14px;font:500 .9rem var(--f-mono);overflow:hidden}

/* mock browser */
.mb{border:2px solid var(--ink);border-radius:12px;overflow:hidden;background:var(--surface)}
.mb-tabs{display:flex;gap:4px;background:var(--surface-2);padding:6px 6px 0;overflow-x:auto}
.mb-tab{min-height:40px;padding:4px 12px;border:2px solid var(--line);border-bottom:0;border-radius:10px 10px 0 0;background:var(--surface-2);font-size:.85rem;white-space:nowrap}
.mb-tab[aria-selected="true"]{background:var(--surface);border-color:var(--ink);font-weight:700}
.mb-bar{display:flex;gap:6px;padding:8px;align-items:center;flex-wrap:wrap;border-bottom:2px solid var(--line)}
.mb-bar button{min-width:44px;min-height:44px;border:2px solid var(--line);border-radius:10px;background:var(--surface);font-weight:700}
.mb-bar button.on{background:var(--c-cookie);color:var(--surface);border-color:var(--c-cookie)}
.mb-bar form{flex:1 1 180px;display:flex;gap:6px}
.mb-bar input{flex:1;min-width:0;min-height:44px;border:2px solid var(--line);border-radius:999px;padding:0 14px;font:500 .85rem var(--f-mono);background:var(--surface-2)}
.mb-bm{display:flex;gap:6px;padding:6px 8px;flex-wrap:wrap;font-size:.8rem;border-bottom:1px solid var(--line);min-height:38px;align-items:center;color:var(--muted)}
.mb-bm button{border:0;background:var(--surface-2);border-radius:8px;padding:6px 10px;font-size:.8rem;min-height:32px}
.mb-page{padding:18px;min-height:190px;display:flex;flex-direction:column;gap:10px}
.mb-page h4{font:800 1.4rem var(--f-display);margin:0}
.mb-page .lk{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;min-height:32px;text-align:left}
.mb-panel{margin:0 8px 8px;padding:10px;border-radius:10px;background:var(--surface-2);font-size:.85rem}
.found{list-style:none;padding:0!important}
.found li{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:10px;border:2px solid var(--line)}
.found li i{font-style:normal;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:.8rem}
.found li.got{border-color:var(--good);background:var(--good-bg)}
.found li.got i{background:var(--good);border-color:var(--good);color:var(--surface)}
.code{font:500 .82rem/1.6 var(--f-mono);background:var(--ink);color:var(--surface);border-radius:12px;padding:14px;overflow-x:auto;white-space:pre;margin:0}
.render{border:2px solid var(--ink);border-radius:12px;padding:14px;min-height:180px;display:flex;flex-direction:column;gap:8px}
.render>*{transition:opacity .4s,transform .4s}
.render .h{opacity:0;transform:translateY(8px)}
.crab{width:72px;height:48px;border-radius:8px;background:var(--c-cookie);display:grid;place-items:center;color:var(--surface);font-weight:700;font-size:.75rem}

/* cookies */
.lab{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.shop{border:2px solid var(--ink);border-radius:12px;overflow:hidden;background:var(--surface);display:flex;flex-direction:column}
.shop-top{background:var(--surface-2);padding:8px 12px;font:500 .8rem var(--f-mono);display:flex;gap:8px;align-items:center}
.shop-body{padding:14px;display:flex;flex-direction:column;gap:12px;min-height:300px}
.shop.closed .shop-body{align-items:center;justify-content:center;color:var(--muted);text-align:center}
.prod{display:flex;flex-wrap:wrap;gap:8px}
.login{display:flex;flex-direction:column;gap:8px;border-top:2px dashed var(--line);padding-top:12px}
.login label{display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-height:44px}
.login input[type=text],.login select{min-height:44px;border:2px solid var(--line);border-radius:10px;padding:0 10px;background:var(--surface)}
.login input[type=checkbox]{width:22px;height:22px}
.greet{background:var(--good-bg);color:var(--good);padding:8px 12px;border-radius:10px;font-weight:700}
.pc{display:flex;flex-direction:column;gap:12px}
.mem{border:3px solid var(--ink);border-radius:12px;padding:12px;min-height:118px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.mem.ram{border-style:dashed}
.mem h3 small{font:500 .75rem var(--f-body);color:var(--muted);display:block}
.ck{border-radius:10px;padding:8px 10px;background:color-mix(in srgb,var(--c-cookie) 16%,var(--surface));border:2px solid var(--c-cookie);font:500 .75rem/1.5 var(--f-mono)}
.ck b{font-family:var(--f-display);font-size:.9rem;display:block}
.ck.crumble{animation:crumble .7s forwards}
@keyframes crumble{to{opacity:0;transform:scale(.4) rotate(18deg);filter:blur(3px)}}
.empty{color:var(--muted);font-size:.85rem}
.log{background:var(--surface-2);border-radius:10px;padding:10px 12px;font-weight:700;min-height:3.2em}
table{border-collapse:collapse;width:100%}
.tw{overflow-x:auto}
th,td{border:2px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top;font-size:.95rem}
th{font-family:var(--f-display);background:var(--surface-2)}
.flips{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px}
.flip{min-height:120px;border:2px solid var(--c-cookie);border-radius:12px;background:var(--surface);padding:12px;text-align:left;display:flex;flex-direction:column;gap:6px}
.flip b{font-family:var(--f-display);font-size:1.05rem}
.flip span{font-size:.9rem;color:var(--muted)}
.flip[aria-pressed="false"] span{visibility:hidden}
.flip[aria-pressed="false"]::after{content:"Tap for an example";font-size:.8rem;color:var(--c-cookie);font-weight:700;margin-top:auto}

/* exam */
.q{gap:12px}
.qh{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.qh .l{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.marks{font:700 .85rem var(--f-mono)}
.q textarea{width:100%;min-height:96px;border:2px solid var(--line);border-radius:10px;padding:10px;background:var(--surface);resize:vertical}
.ms{display:flex;flex-direction:column;gap:6px;background:var(--surface-2);border-radius:10px;padding:12px}
.ms label{display:flex;gap:10px;align-items:flex-start;min-height:36px}
.ms input{width:20px;height:20px;flex:none;margin-top:3px}
.gap select,.tick select{min-height:40px;border:2px solid var(--ink);border-radius:8px;background:var(--surface);padding:0 6px;font-weight:700}
.gap p{line-height:2.4}
.score{position:sticky;top:78px;z-index:5}
.bars{display:flex;flex-direction:column;gap:6px}
.bar-row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,2fr) 3.4em;gap:8px;align-items:center;font-size:.85rem}
.track{height:12px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.track i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .4s}
.bar-row span:last-child{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
.confetti{position:fixed;left:50%;top:40%;width:10px;height:14px;z-index:50;pointer-events:none;animation:conf 1.1s ease-out forwards}
@keyframes conf{to{transform:translate(var(--x),var(--y)) rotate(540deg);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <a class="brand" href="#home"><b>5.1</b><span>Follow One Click</span></a>
    <nav class="route" id="route" aria-label="Pages"></nav>
    <button class="icon-btn" id="theme" aria-label="Switch between light and dark theme">◐</button>
  </div>
</header>
<main id="app" tabindex="-1"></main>

<script>
(function(){
"use strict";
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
const wait=ms=>new Promise(r=>setTimeout(r,RM?Math.min(ms,60):ms));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');

/* ---------- saved progress (this browser only) ---------- */
let store={done:{},exam:{}};
try{const s=JSON.parse(localStorage.getItem('foc51')||'null');if(s&&s.done&&s.exam)store=s}catch(e){}
const save=()=>{try{localStorage.setItem('foc51',JSON.stringify(store))}catch(e){}};

const PAGES=[
 {id:'home',label:'Start'},
 {id:'internet-www',label:'Internet / WWW',title:'Internet vs World Wide Web',k:'--c-domain',obj:'Understand the difference between the internet and the World Wide Web'},
 {id:'url',label:'URL',title:'The URL',k:'--c-protocol',obj:'Understand what is meant by a uniform resource locator (URL)'},
 {id:'http',label:'HTTP / HTTPS',title:'HTTP and HTTPS',k:'--c-file',obj:'Describe the purpose and operation of HTTP and HTTPS'},
 {id:'browser',label:'Browser',title:'The web browser',k:'--c-browser',obj:'Explain the purpose and functions of a web browser'},
 {id:'journey',label:'Page journey',title:'How a web page reaches you',k:'--c-dns',obj:'Describe how web pages are located, retrieved and displayed'},
 {id:'cookies',label:'Cookies',title:'Cookies',k:'--c-cookie',obj:'Explain what cookies are and how they are used, including session and persistent cookies'},
 {id:'exam',label:'Exam practice'}
];
const TEACH=PAGES.slice(1,7);

/* ---------- icons ---------- */
const IC={
 browser:'<svg viewBox="0 0 40 40" aria-hidden="true"><rect x="3" y="6" width="34" height="28" rx="5" fill="none" stroke="currentColor" stroke-width="3"/><path d="M3 15h34" stroke="currentColor" stroke-width="3"/><circle cx="9" cy="10.5" r="1.6" fill="currentColor"/><circle cx="14" cy="10.5" r="1.6" fill="currentColor"/></svg>',
 dns:'<svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 10c-4-3-9-3-15-2v22c6-1 11-1 15 2 4-3 9-3 15-2V8c-6-1-11-1-15 2z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/><path d="M20 10v22" stroke="currentColor" stroke-width="3"/></svg>',
 server:'<svg viewBox="0 0 40 40" aria-hidden="true"><rect x="6" y="4" width="28" height="9" rx="3" fill="none" stroke="currentColor" stroke-width="3"/><rect x="6" y="16" width="28" height="9" rx="3" fill="none" stroke="currentColor" stroke-width="3"/><rect x="6" y="28" width="28" height="9" rx="3" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="12" cy="8.5" r="1.6" fill="currentColor"/><circle cx="12" cy="20.5" r="1.6" fill="currentColor"/><circle cx="12" cy="32.5" r="1.6" fill="currentColor"/></svg>'
};

/* ---------- shared pieces ---------- */
function confetti(){
  if(RM)return;
  const cols=['--c-protocol','--c-domain','--c-file','--c-cookie','--c-browser','--c-dns'];
  for(let i=0;i<18;i++){const d=document.createElement('i');d.className='confetti';d.style.background=`var(${cols[i%6]})`;
    d.style.setProperty('--x',(Math.random()*360-180)+'px');d.style.setProperty('--y',(Math.random()*-260+60)+'px');
    document.body.appendChild(d);setTimeout(()=>d.remove(),1200)}
}
function markDone(id){ if(!store.done[id]){store.done[id]=1;save();confetti()} drawRoute(); }

function head(p,big){const n=PAGES.indexOf(p);
  return `<header class="phead"><p class="stop">Stop ${n} of 6</p><h1>${p.title}</h1><p class="big">${big}</p></header>`}
function foot(p){const n=PAGES.indexOf(p),a=PAGES[n-1],b=PAGES[n+1];
  return `<nav class="pn" aria-label="Previous and next page">${a?`<a class="btn" href="#${a.id}">← ${a.label}</a>`:'<span></span>'}${b?`<a class="btn primary" href="#${b.id}">Next: ${b.label} →</a>`:''}</nav>`}
const examBox=pts=>`<section class="card exam"><h3>What to write in the exam</h3><ul>${pts.map(x=>`<li>${x}</li>`).join('')}</ul></section>`;
const mistake=t=>`<section class="card mistake"><h3>Common mistake</h3><p>${t}</p></section>`;

function qcHTML(qs){return `<section class="card qc"><h2>Quick check</h2><p class="hint">Get all three right to complete this stop.</p>${qs.map((q,i)=>`<fieldset data-q="${i}"><legend>${i+1}. ${q.q}</legend>${q.o.map((o,j)=>`<button type="button" class="opt" data-o="${j}">${o}</button>`).join('')}<p class="fb" aria-live="polite"></p></fieldset>`).join('')}<div class="qc-done" aria-live="polite"></div></section>`}
function qcInit(root,pid,qs){const got=new Set();const box=$('.qc',root);
  const fin=()=>{$('.qc-done',box).innerHTML='<p class="complete pop">Stop complete. You can move on.</p>'};
  if(store.done[pid])fin();
  box.addEventListener('click',e=>{const b=e.target.closest('.opt');if(!b)return;const fs=b.closest('fieldset'),i=+fs.dataset.q,q=qs[i],fb=$('.fb',fs);
    if(+b.dataset.o===q.a){$$('.opt',fs).forEach(x=>{x.classList.remove('wrong');x.disabled=true});b.classList.add('right');fb.className='fb ok';fb.textContent=q.why;got.add(i);
      if(got.size===qs.length){markDone(pid);fin()}}
    else{b.classList.add('wrong','shake');setTimeout(()=>b.classList.remove('shake'),350);fb.className='fb no';fb.textContent=q.no||'Not that one. Look at the big idea at the top of the page.'}
  });
}

/* tap-or-drag sorter */
function sorter(el,items,bins,onDone){
  let sel=null,left=items.length,first=0;const tried=new Set();
  el.innerHTML=`<div class="pool" role="group" aria-label="Statements to sort">${shuffle(items.map((it,i)=>({...it,i}))).map(it=>`<button type="button" class="chip" draggable="true" aria-pressed="false" data-i="${it.i}">${it.t}</button>`).join('')}</div>
  <div class="bins">${bins.map(b=>`<button type="button" class="bin" data-b="${b.id}"><strong>${b.label}</strong></button>`).join('')}</div><p class="fb" aria-live="polite">Tap a statement, then tap the box it belongs in. You can also drag.</p>`;
  const fb=$('.fb',el);
  const pick=c=>{$$('.chip',el).forEach(x=>x.setAttribute('aria-pressed','false'));sel=c;if(c)c.setAttribute('aria-pressed','true');$$('.bin',el).forEach(b=>b.classList.toggle('ready',!!c))};
  const place=bin=>{if(!sel)return;const it=items[+sel.dataset.i];
    if(it.bin===bin.dataset.b){if(!tried.has(sel.dataset.i))first++;const s=document.createElement('span');s.className='in pop';s.textContent=it.t;bin.appendChild(s);sel.remove();left--;pick(null);
      fb.className='fb ok';fb.textContent=left?'Correct. '+left+' left.':'All sorted correctly.';if(!left&&onDone)onDone(first)}
    else{tried.add(sel.dataset.i);sel.classList.add('shake');const c=sel;setTimeout(()=>c.classList.remove('shake'),350);fb.className='fb no';fb.textContent='Not that box. Think again and try the other one.'}};
  el.addEventListener('click',e=>{const c=e.target.closest('.chip'),b=e.target.closest('.bin');if(c)pick(sel===c?null:c);else if(b)place(b)});
  el.addEventListener('dragstart',e=>{const c=e.target.closest('.chip');if(c){pick(c);e.dataTransfer.setData('text/plain','x')}});
  el.addEventListener('dragover',e=>{if(e.target.closest('.bin'))e.preventDefault()});
  el.addEventListener('drop',e=>{const b=e.target.closest('.bin');if(b){e.preventDefault();place(b)}});
}

/* tap matcher */
function matcher(el,pairs,onDone){
  let a=null,b=null,n=0,first=0;const tried=new Set();
  el.innerHTML=`<div class="match"><div>${pairs.map((p,i)=>`<button type="button" class="chip" data-s="a" data-i="${i}" aria-pressed="false">${p.a}</button>`).join('')}</div><div>${shuffle(pairs.map((p,i)=>i)).map(i=>`<button type="button" class="chip" data-s="b" data-i="${i}" aria-pressed="false">${pairs[i].b}</button>`).join('')}</div></div><p class="fb" aria-live="polite">Tap a term on the left, then its description on the right.</p>`;
  const fb=$('.fb',el);
  el.addEventListener('click',e=>{const c=e.target.closest('.chip');if(!c||c.classList.contains('locked'))return;
    if(c.dataset.s==='a'){if(a)a.setAttribute('aria-pressed','false');a=c}else{if(b)b.setAttribute('aria-pressed','false');b=c}
    c.setAttribute('aria-pressed','true');
    if(a&&b){if(a.dataset.i===b.dataset.i){n++;if(!tried.has(a.dataset.i))first++;[a,b].forEach(x=>{x.classList.add('locked','pop');x.setAttribute('aria-pressed','false');x.insertAdjacentHTML('afterbegin',`<span class="n">${n}</span>`)});
        fb.className='fb ok';fb.textContent=n===pairs.length?'All matched.':'Correct match.';if(n===pairs.length&&onDone)onDone(first)}
      else{tried.add(a.dataset.i);[a,b].forEach(x=>{x.classList.add('shake');x.setAttribute('aria-pressed','false');setTimeout(()=>x.classList.remove('shake'),350)});fb.className='fb no';fb.textContent='Those two do not go together. Try again.'}
      a=b=null}});
}

/* tap-the-part URL game */
const PART={protocol:'protocol',domain:'domain name',file:'web page / file name'};
function urlTap(el,rounds,onDone){
  let r=0,first=0,miss=false;
  const draw=()=>{const R=rounds[r];
    el.innerHTML=`<p><strong>Round ${r+1} of ${rounds.length}.</strong> Tap the <strong>${PART[R.ask]}</strong>.</p>
    <div class="urlbig" style="font-size:clamp(.85rem,2.6vw,1.25rem)"><button type="button" class="seg" data-p="protocol">${R.u[0]}</button><span class="sep">://</span><button type="button" class="seg" data-p="domain">${R.u[1]}</button><button type="button" class="seg" data-p="file">${R.u[2]}</button></div><p class="fb" aria-live="polite"></p>`};
  draw();
  el.addEventListener('click',e=>{const s=e.target.closest('.seg');if(!s||el.dataset.lock)return;const R=rounds[r],fb=$('.fb',el);
    if(s.dataset.p===R.ask){if(!miss)first++;s.classList.add('hit','pop');fb.className='fb ok';fb.textContent='Correct.';el.dataset.lock=1;
      setTimeout(()=>{delete el.dataset.lock;r++;miss=false;if(r<rounds.length)draw();else{el.innerHTML=`<p class="complete pop">Finished. ${first} of ${rounds.length} right first time.</p>`;if(onDone)onDone(first)}},RM?300:800)}
    else{miss=true;s.classList.add('shake');setTimeout(()=>s.classList.remove('shake'),350);fb.className='fb no';fb.textContent='That is the '+PART[s.dataset.p]+'. Try again.'}});
}

/* ---------- the journey scene (home + stop 5) ---------- */
const POS={device:[15,54],dns:[50,17],dns2:[85,17],server:[68,84]};
const DOMAIN='www.pedalshop.com',IP='203.0.113.25';
function journey(el,opt){
  const compact=opt&&opt.compact;
  const base=[
   {cap:`The user types a URL into the browser's address bar (or clicks a link).`,at:'device'},
   {cap:'The browser sends the domain name from the URL to the DNS.',from:'device',to:'dns',label:DOMAIN+' ?'},
   {cap:'The DNS looks up the domain name in its database of domain names and matching IP addresses.',at:'dns'},
   {cap:'The DNS returns the IP address to the browser.',from:'dns',to:'device',label:IP},
   {cap:'The browser sends a request to the web server at that IP address, using HTTP or HTTPS.',from:'device',to:'server',label:'HTTPS request'},
   {cap:'The web server sends the data for the web page (HTML) back to the browser.',from:'server',to:'device',label:'<html>…'},
   {cap:'The browser renders the HTML and displays the web page.',at:'device',end:true}];
  const extra=[
   {cap:'This DNS cannot find the domain name, so it asks a second DNS.',from:'dns',to:'dns2',label:DOMAIN+' ?'},
   {cap:'The second DNS finds the IP address and sends it back. The first DNS adds it to its own database.',from:'dns2',to:'dns',label:IP}];
  let steps=base,i=-1,playing=false,busy=false,tok=0,branch=false;
  const L=(a,b)=>`<line data-w="${a}-${b}" x1="${POS[a][0]}" y1="${POS[a][1]}" x2="${POS[b][0]}" y2="${POS[b][1]}"/>`;
  el.innerHTML=`<div class="scene">
    <svg class="wires" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">${L('device','dns')}${L('dns','dns2')}${L('device','server')}</svg>
    <div class="node t-browser" data-n="device" style="left:${POS.device[0]}%;top:${POS.device[1]}%">${IC.browser}<b>Web browser</b><div class="ab"></div><div class="scr">blank</div></div>
    <div class="node t-dns" data-n="dns" style="left:${POS.dns[0]}%;top:${POS.dns[1]}%">${IC.dns}<b>DNS</b><small class="tbl">domain name → IP address</small></div>
    <div class="node t-dns" data-n="dns2" hidden style="left:${POS.dns2[0]}%;top:${POS.dns2[1]}%">${IC.dns}<b>Second DNS</b><small>${DOMAIN} → ${IP}</small></div>
    <div class="node t-server" data-n="server" style="left:${POS.server[0]}%;top:${POS.server[1]}%">${IC.server}<b>Web server</b><small>${IP}<br>stores the web pages</small></div>
    <div class="packet" hidden></div></div>
   <div class="row"><button type="button" class="btn primary" data-a="play">▶ Play</button>${compact?'':'<button type="button" class="btn" data-a="next">Next step</button>'}<button type="button" class="btn" data-a="replay">↺ Replay</button>
   ${compact?'':'<label class="row" style="min-height:44px"><input type="checkbox" data-a="branch" style="width:22px;height:22px"> What if the first DNS cannot find it?</label>'}</div>
   ${compact?'<p class="log" aria-live="polite">Press Play to follow one click from the address bar to the finished page.</p>':'<ol class="steps card" aria-live="polite"></ol>'}`;
  const sc=$('.scene',el),pk=$('.packet',el),node=n=>$(`[data-n="${n}"]`,sc);
  const list=()=>{if(compact)return;$('.steps',el).innerHTML=steps.map((s,k)=>`<li class="${k<i?'past':k===i?'cur':''}">${s.cap}</li>`).join('')};
  const paint=()=>{ // scene state after step i
    $('.ab',sc).textContent=i>=0?'https://'+DOMAIN:'';
    const end=i>=steps.length-1;const scr=$('.scr',sc);scr.textContent=end?'Page displayed':i>=steps.length-2?'HTML received':'blank';scr.classList.toggle('loaded',end);
    $('.tbl',sc).textContent=i>=2?DOMAIN+' → '+IP:'domain name → IP address';
    $$('.node',sc).forEach(n=>n.classList.remove('active'));
    const s=steps[i];if(s){node(s.to||s.at).classList.add('active')}
    $('[data-a=play]',el).textContent=playing?'❚❚ Pause':'▶ Play';
    if(compact)$('.log',el).textContent=s?s.cap:'Press Play to follow one click from the address bar to the finished page.';
    list()};
  const fly=(a,b,label)=>new Promise(res=>{pk.textContent=label;pk.style.transition='none';pk.style.left=POS[a][0]+'%';pk.style.top=POS[a][1]+'%';pk.hidden=false;void pk.offsetWidth;
    const d=RM?1:1200;pk.style.transition=`left ${d}ms ease-in-out, top ${d}ms ease-in-out`;pk.style.left=POS[b][0]+'%';pk.style.top=POS[b][1]+'%';setTimeout(()=>{pk.hidden=true;res()},d+250)});
  async function step(){const t=tok;busy=true;i++;const s=steps[i];
    $$('.node',sc).forEach(n=>n.classList.remove('active'));
    if(!compact){list()}else $('.log',el).textContent=s.cap;
    if(i===0&&!RM){const ab=$('.ab',sc),u='https://'+DOMAIN;for(let k=1;k<=u.length;k++){if(t!==tok)return;ab.textContent=u.slice(0,k);await wait(35)}}
    if(s.from){node(s.from).classList.add('active');await fly(s.from,s.to,s.label)}else await wait(500);
    if(t!==tok)return;busy=false;paint()}
  async function play(){playing=true;paint();const t=tok;while(playing&&i<steps.length-1){await step();if(t!==tok)return;await wait(900);if(t!==tok)return}playing=false;paint()}
  const reset=()=>{tok++;i=-1;playing=false;busy=false;pk.hidden=true;paint()};
  el.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
    if(a==='play'){if(playing){playing=false;paint()}else{if(i>=steps.length-1)reset();if(!busy)play()}}
    if(a==='next'&&!busy&&!playing&&i<steps.length-1)step();
    if(a==='replay'){reset();play()}});
  el.addEventListener('change',e=>{if(e.target.dataset.a!=='branch')return;branch=e.target.checked;steps=branch?[...base.slice(0,3),...extra,...base.slice(3)]:base;
    node('dns2').hidden=!branch;reset()});
  paint();
  return {play,reset,stop:()=>{tok++;playing=false}};
}

/* ---------- pages ---------- */
const V={};
let cleanup=null;

V.home={html(){return `
<section class="hero">
  <p class="stop">Cambridge O Level / IGCSE Computer Science · Topic 5.1</p>
  <h1>Follow <em>one click.</em></h1>
  <p class="big">You type a web address and press Enter. About a second later a page appears. This site shows you everything that happens in between, in six short stops.</p>
  <div id="heroScene"></div>
</section>
<section class="card"><h2>The six stops</h2><p class="hint">Each stop takes about five minutes. Finish its quick check to tick it off.</p>
  <div class="stops">${TEACH.map((p,n)=>`<a class="stopcard ${store.done[p.id]?'done':''}" href="#${p.id}" style="--k:var(${p.k})"><span class="num">STOP ${n+1}</span><h3>${p.title}</h3><p class="hint">${p.obj}.</p><span class="st">${store.done[p.id]?'✓ Complete':'Not done yet →'}</span></a>`).join('')}</div>
</section>
<section class="card"><h2>After the six stops</h2><p>Try 13 exam-style questions worth 44 marks, check your answers against the marking points, and get a one-page summary.</p>
  <div class="row"><a class="btn primary" href="#internet-www">Start at stop 1 →</a><a class="btn" href="#exam">Go to exam practice</a><button type="button" class="btn" id="reset">Reset progress</button><span class="fb" id="resetFb" aria-live="polite"></span></div>
</section>`},
init(r){const j=journey($('#heroScene',r),{compact:true});cleanup=j.stop;if(!RM)setTimeout(()=>{if(location.hash.replace('#','')===''||location.hash==='#home')j.play()},600);
  let armed=false;$('#reset',r).addEventListener('click',e=>{if(!armed){armed=true;e.target.textContent='Tap again to clear all progress';return}
    store={done:{},exam:{}};save();render()})}};

V['internet-www']={html(p){return head(p,'The <strong>internet</strong> is the infrastructure. The <strong>World Wide Web</strong> is the collection of websites and web pages accessed using the internet.')+`
<section class="card"><h2>Switch the layers on and off</h2><p>The dark strip at the bottom is the internet: the cables, routers and networks that join devices together. The boxes above are things that travel over it. Turn them off and on. Then turn the internet itself off.</p>
  <div class="layers" id="layers">
    <div class="services">
      <div class="svc www" data-s><span class="tag">WORLD WIDE WEB</span><h3>Web pages</h3><p class="hint">Websites viewed in a browser.</p><label><input type="checkbox" checked id="s-web"> On</label></div>
      <div class="svc" data-s><span class="tag" style="color:var(--muted)">NOT THE WEB</span><h3>Email</h3><p class="hint">Sending and receiving messages.</p><label><input type="checkbox" checked id="s-mail"> On</label></div>

`+examBox(['A cookie is a small text file, sent by a web server and stored by the web browser.','Session cookies are stored in memory (RAM) and are deleted when the browser is closed.','Persistent cookies are stored on the hard drive and stay until they expire or the user deletes them.','Uses: saving personal details, tracking user preferences, holding items in an online shopping cart, storing login details.','When you compare the two types, always say <strong>where each is stored</strong> and <strong>when each is deleted</strong>.'])

init(r,p){const L={open:true,basket:[],logged:null,viaSession:false,lang:'en',persist:null,m:new Set()};
  const log=t=>{$('#clog',r).textContent=t};
  const hit=k=>{if(!L.m.has(k)){L.m.add(k);if(L.m.size===5)confetti()}};
  const draw=()=>{const sess=L.open&&(L.basket.length||L.viaSession);
    $('#miss',r).innerHTML=MISS.map((m,k)=>`<li class="${L.m.has(m[0])?'got':''}"><i>${L.m.has(m[0])?'✓':k+1}</i><span>${m[1]}</span></li>`).join('');
    $('#ram',r).innerHTML=sess?`<div class="ck pop"><b>Session cookie</b>${L.basket.length?'basket = '+L.basket.join(', ')+'<br>':''}${L.viaSession?'loggedIn = '+esc(L.logged)+'<br>':''}expires = (no expiry date)</div>`:'<p class="empty">Empty</p>';
    $('#hdd',r).innerHTML=L.persist?`<div class="ck"><b>Persistent cookie</b>user = ${esc(L.persist.name)}<br>language = ${L.persist.lang}<br>expires = in 30 days</div>`:'<p class="empty">Empty</p>';
    $('#power',r).textContent=L.open?'✕ Close browser':'Reopen browser';$('#power',r).disabled=false;
    $('#ff',r).disabled=$('#del',r).disabled=!L.persist;
    const shop=$('#shop',r);shop.classList.toggle('closed',!L.open);
    shop.innerHTML=L.open?`<div class="shop-top"><span aria-hidden="true">🔒</span> https://www.pedalshop.com</div><div class="shop-body">
      ${L.logged?`<p class="greet">${GREET[L.lang]}, ${esc(L.logged)}!</p>`:''}
      <h3>Pedal Shop</h3><div class="prod">${ITEMS.map(it=>`<button type="button" class="btn" data-add="${it}" ${L.basket.includes(it)?'disabled':''}>+ ${it}</button>`).join('')}</div>
      <p><strong>${BASK[L.lang]}:</strong> ${L.basket.length?L.basket.join(', '):'empty'}</p>
      ${L.logged?'':`<form class="login" id="lf"><label for="nm">Display name <input type="text" id="nm" value="Sam" maxlength="14" autocomplete="off"></label>
        <label for="lg">Language <select id="lg"><option value="en">English</option><option value="fr">Français</option><option value="es">Español</option></select></label>
        <label for="rm"><input type="checkbox" id="rm" checked> Remember me</label><button type="submit" class="btn primary">Log in</button><p class="hint">Use a made-up name. Nothing leaves this page.</p></form>`}</div>`
      :`<div class="shop-body"><h3>Browser closed</h3><p>The website session has ended.</p></div>`};
  draw();
  r.addEventListener('click',e=>{const add=e.target.closest('[data-add]');
    if(add){L.basket.push(add.dataset.add);hit('basket');log('A session cookie in RAM now holds the basket. It has no expiry date.');draw();return}
    const f=e.target.closest('.flip');if(f){f.setAttribute('aria-pressed',f.getAttribute('aria-pressed')!=='true');return}
    const id=e.target.id;
    if(id==='power'){if(L.open){const had=L.basket.length||L.viaSession;const c=$('#ram .ck',r);L.open=false;hit('close');
        log(had?'Browser closed. The session cookie in RAM is deleted, so the basket is lost.'+(L.persist?' The persistent cookie stays on the hard drive.':''):'Browser closed. There was no session cookie to delete.');
        if(c&&!RM){c.classList.add('crumble');setTimeout(()=>{L.basket=[];L.logged=null;L.viaSession=false;draw()},700);$('#power',r).disabled=true}else{L.basket=[];L.logged=null;L.viaSession=false;draw()}}
      else{L.open=true;hit('reopen');if(L.persist){L.logged=L.persist.name;L.lang=L.persist.lang;log('The website read the persistent cookie. It recognises '+L.persist.name+' and uses the saved language. The basket is empty because the session cookie was deleted.')}
        else{L.lang='en';log('No persistent cookie was found, so the website does not recognise this user. They must log in again.')}draw()}}
    if(id==='ff'&&L.persist){L.persist=null;hit('gone');log('The expiry date has passed, so the persistent cookie is deleted. Next visit, the site will not recognise this user.');draw()}
    if(id==='del'&&L.persist){L.persist=null;hit('gone');log('The user deleted the persistent cookie. Next visit, the site will not recognise this user.');draw()}});
  r.addEventListener('submit',e=>{if(e.target.id!=='lf')return;e.preventDefault();const nm=($('#nm',r).value.trim()||'Sam'),lg=$('#lg',r).value,rm=$('#rm',r).checked;
    L.logged=nm;L.lang=lg;L.viaSession=true;if(rm){L.persist={name:nm,lang:lg};hit('login');log('Logged in. A persistent cookie with an expiry date is saved on the hard drive. The session cookie records that you are logged in now.')}
    else log('Logged in without "Remember me". Only the session cookie knows. Close the browser and the login is forgotten.');draw()});
  qcInit(r,p.id,QC.cookies)}};
